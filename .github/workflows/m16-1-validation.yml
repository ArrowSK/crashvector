name: M16.1 validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: crashvector-m16-1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.4.1

jobs:
  m16-1-visual-polish:
    name: M16.1 visual polish and camera composition
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Architecture audit
        run: sh tools/check_no_monkey_patching.sh
      - name: Import and parse project
        run: |
          tools/ci_godot_checked.sh godot --headless --path . --editor --quit
          tools/ci_godot_checked.sh godot --headless --path . --script res://tests/project_parse.gd
      - name: Preserve M10 responsive shell contract
        run: tools/ci_godot_checked.sh godot --headless --path . --script res://tests/m10_layout.gd
      - name: Preserve M16 UX and M15 integration
        run: tools/ci_godot_checked.sh godot --headless --path . --script res://tests/m16_ui_vehicle_visuals.gd
      - name: M16.1 visual polish, camera and UI regression
        run: tools/ci_godot_checked.sh godot --headless --path . --script res://tests/m16_1_visual_polish.gd
      - name: D-segment 200 km/h concrete-barrier packaged case
        run: tools/ci_godot_checked.sh godot --headless --path . --script res://tests/m16_1_d_segment_200_barrier.gd
