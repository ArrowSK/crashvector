  <path d="M545 828 A334 334 0 0 0 617 797" fill="none" stroke="#f4f6f8" stroke-width="8" opacity=".35"/>

  <!-- Explicit V -->
  <path d="M754 324 L826 640 L918 321" fill="none" stroke="#05080b" stroke-width="54" stroke-linejoin="miter"/>
  <path d="M754 324 L826 640 L918 321" fill="none" stroke="#aeb7c1" stroke-width="36" stroke-linejoin="miter"/>
  <path d="M761 326 L828 609" fill="none" stroke="#eef2f5" stroke-width="6" opacity=".45"/>

  <!-- Wheels -->
  <rect x="245" y="392" width="82" height="42" rx="18" fill="#05080b"/>
