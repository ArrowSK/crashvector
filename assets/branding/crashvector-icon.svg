  <path d="M315 425 L516 425 Q557 427 590 452 L617 474 L617 550 L590 572 Q557 597 516 599 L315 599 Q301 557 301 512 Q301 466 315 425 Z" fill="#cbd2d9"/>
  <path d="M334 438 L404 438 L404 586 L334 586 Q319 551 319 512 Q319 473 334 438 Z" fill="#0b1117"/>
