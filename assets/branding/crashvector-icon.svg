    <path d="M706 573 L733 597 L750 568 L731 549 Z" fill="#a7b1bb"/>
  </g>

  <!-- Incoming vector -->
  <line x1="158" y1="512" x2="704" y2="512" stroke="#7d1d0d" stroke-width="34" opacity=".35"/>
  <line x1="158" y1="512" x2="704" y2="512" stroke="#ff4b1b" stroke-width="20" stroke-linecap="round"/>
  <polygon points="690,486 726,512 690,538" fill="#ff4b1b"/>

  <!-- Impact point -->
  <circle cx="720" cy="512" r="29" fill="#120b08" stroke="#ff4b1b" stroke-width="8"/>
  <circle cx="720" cy="512" r="9" fill="#fff3ec"/>

  <!-- Deflection vectors -->
  <line x1="735" y1="496" x2="873" y2="343" stroke="#7d1d0d" stroke-width="32" opacity=".35"/>
  <line x1="735" y1="496" x2="873" y2="343" stroke="#ff4b1b" stroke-width="19" stroke-linecap="round"/>
  <polygon points="854,346 889,325 880,365" fill="#ff4b1b"/>
