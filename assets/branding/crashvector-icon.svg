<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <rect x="44" y="44" width="936" height="936" rx="218" fill="#0d1218"/>
  <rect x="60" y="60" width="904" height="904" rx="202" fill="none" stroke="#303842" stroke-width="10"/>

  <!-- Telemetry ring deliberately shaped as a C -->
