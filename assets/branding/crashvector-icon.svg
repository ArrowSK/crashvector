  <path d="M682 263 A291 291 0 1 0 682 761" fill="none" stroke="#707b87" stroke-width="18"/>
  <path d="M457 189 A334 334 0 0 0 286 247" fill="none" stroke="#0d1218" stroke-width="38"/>
  <path d="M291 778 A334 334 0 0 0 454 835" fill="none" stroke="#0d1218" stroke-width="38"/>
