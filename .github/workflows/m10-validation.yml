name: M10 validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: crashvector-m10-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  m10-validation:
    name: M10 editor and responsive layout
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Architecture audit
        run: sh tools/check_no_monkey_patching.sh
      - name: Import and parse project
        run: |
          tools/ci_godot_checked.sh godot --headless --path . --editor --quit
          tools/ci_godot_checked.sh godot --headless --path . --script res://tests/project_parse.gd
      - name: M10 editor smoke
        run: tools/ci_godot_checked.sh godot --headless --path . --script res://tests/m10_editor_smoke.gd
      - name: M10 responsive layout
        run: tools/ci_godot_checked.sh godot --headless --path . --script res://tests/m10_layout.gd
