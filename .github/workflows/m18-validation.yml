name: M18 validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: crashvector-m18-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.4.1

jobs:
  m18-passenger-car-side-impact:
    name: M18 passenger-car broadside physics
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Architecture audit
        run: sh tools/check_no_monkey_patching.sh
      - name: Import and parse project
        run: |
          tools/ci_godot_checked.sh godot --headless --path . --editor --quit
          tools/ci_godot_checked.sh godot --headless --path . --script res://tests/project_parse.gd
      - name: Preserve M17 production integration
        run: tools/ci_godot_checked.sh godot --headless --path . --script res://tests/m17_production_integration.gd
      - name: M18 perpendicular passenger-car regression
        run: tools/ci_godot_checked.sh godot --headless --path . --script res://tests/m18_side_impacts.gd
