  <path d="M567 612 L600 628 L614 616 L585 596 Z" fill="#cfd6dd" stroke="#05080b" stroke-width="6"/>

  <!-- Crumple zone -->
  <g stroke="#05080b" stroke-width="5" stroke-linejoin="round">
    <path d="M648 459 L697 443 L722 470 L694 493 Z" fill="#f3f5f7"/>
    <path d="M663 482 L718 470 L733 502 L698 514 Z" fill="#bac3cc"/>
    <path d="M664 542 L718 554 L733 522 L698 510 Z" fill="#e4e8ec"/>
