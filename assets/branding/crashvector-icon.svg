  <line x1="735" y1="528" x2="873" y2="681" stroke="#ff4b1b" stroke-width="19" stroke-linecap="round"/>
  <polygon points="854,678 889,699 880,659" fill="#ff4b1b"/>

  <!-- Debris -->
  <path d="M748 477 l20 -9 -5 23 z" fill="#cbd2d9"/>
  <path d="M759 546 l23 13 -20 11 z" fill="#7d8792"/>
  <path d="M736 460 l8 -18 10 16 z" fill="#f2f4f6"/>
</svg>
