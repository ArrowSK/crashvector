name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: crashvector-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.4.1
  GODOT_TAG: 4.4.1-stable

jobs:
  core-ci:
    name: Core CI (M0-M9)
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Architecture audit
        run: sh tools/check_no_monkey_patching.sh
      - name: Import and parse project
        run: |
          tools/ci_godot_checked.sh godot --headless --path . --editor --quit
          tools/ci_godot_checked.sh godot --headless --path . --script res://tests/project_parse.gd
      - name: Run complete M0-M9 regression suite
        shell: bash
        run: |
          set -euo pipefail
          for test_script in \
            m0_smoke.gd m1_structural.gd m2_hatchback.gd m3_vehicle_truck.gd \
            m4_scenario_editor.gd m5_analysis_replay.gd m5_editor_smoke.gd \
            m6_comparison.gd m6_editor_smoke.gd m7_video_export.gd m7_editor_smoke.gd \
            m8_calibration.gd m8_editor_smoke.gd road_users_comparison.gd \
            road_users_editor_smoke.gd m9_updater.gd m9_editor_smoke.gd; do
            echo "=== $test_script ==="
            tools/ci_godot_checked.sh godot --headless --path . --script "res://tests/$test_script"
          done

  macos-package:
    name: macOS Universal 2 package
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install icon tooling
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Download official Godot 4.4.1 editor and export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$RUNNER_TEMP/templates"
          curl --fail --location --retry 3 --retry-all-errors "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_macos.universal.zip" -o "$RUNNER_TEMP/godot.zip"
          ditto -x -k "$RUNNER_TEMP/godot.zip" "$RUNNER_TEMP/godot"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot" -path '*/Contents/MacOS/Godot' -type f | head -n 1)"
          test -x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          curl --fail --location --retry 3 --retry-all-errors "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          ditto -x -k "$RUNNER_TEMP/templates.tpz" "$RUNNER_TEMP/templates"
          TEMPLATE_HOME="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TEMPLATE_HOME"
          cp -R "$RUNNER_TEMP/templates/templates/." "$TEMPLATE_HOME/"
          test -f "$TEMPLATE_HOME/macos.zip"
      - name: Export, identify and sign Universal 2 app
        shell: bash
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . --editor --quit
          "$GODOT_BIN" --headless --path . --script res://tools/render_icon.gd
          python3 tools/generate_icon_containers.py
          python3 tools/prepare_packaging.py
          VERSION="$(python3 tools/prepare_packaging.py --print-version)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p build/macos dist
          "$GODOT_BIN" --headless --path . --export-release "macOS Universal" "build/macos/CrashVector.app"
          APP="build/macos/CrashVector.app"
          test -x "$APP/Contents/MacOS/CrashVector"
          ARCHS="$(lipo -archs "$APP/Contents/MacOS/CrashVector")"
          [[ "$ARCHS" == *"arm64"* && "$ARCHS" == *"x86_64"* ]]
          INFO="$APP/Contents/Info.plist"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO")" == "com.arrowsk.crashvector" ]]
          ICON_FILE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$INFO")"
          [[ "$ICON_FILE" == *.icns ]] || ICON_FILE="${ICON_FILE}.icns"
          cp build/icons/CrashVector.icns "$APP/Contents/Resources/$ICON_FILE"
          if [[ -n "${MACOS_CERTIFICATE_P12:-}" && -n "${MACOS_CERTIFICATE_PASSWORD:-}" && -n "${MACOS_SIGN_IDENTITY:-}" ]]; then
            KEYCHAIN="$RUNNER_TEMP/crashvector.keychain-db"
            KEYCHAIN_PASSWORD="crashvector-ci"
            echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/crashvector-cert.p12"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security import "$RUNNER_TEMP/crashvector-cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security list-keychains -d user -s "$KEYCHAIN"
            codesign --force --deep --options runtime --timestamp --sign "$MACOS_SIGN_IDENTITY" "$APP"
            echo "CV_DEVELOPER_SIGNED=1" >> "$GITHUB_ENV"
          else
            codesign --force --deep --sign - "$APP"
            echo "CV_DEVELOPER_SIGNED=0" >> "$GITHUB_ENV"
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"
      - name: Build, validate, optionally notarize and checksum DMG
        shell: bash
        env:
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          set -euo pipefail
          DMG="dist/CrashVector-${VERSION}-macOS-universal.dmg"
          rm -rf build/dmg-root
          mkdir -p build/dmg-root
          cp -R build/macos/CrashVector.app build/dmg-root/CrashVector.app
          ln -s /Applications build/dmg-root/Applications
          hdiutil create -volname "CrashVector" -srcfolder build/dmg-root -ov -format UDZO "$DMG"
          MOUNT="$RUNNER_TEMP/crashvector-dmg"
          mkdir -p "$MOUNT"
          hdiutil attach "$DMG" -readonly -nobrowse -mountpoint "$MOUNT"
          test -d "$MOUNT/CrashVector.app" && test -L "$MOUNT/Applications"
          hdiutil detach "$MOUNT"
          if [[ "${CV_DEVELOPER_SIGNED:-0}" == "1" && -n "${MACOS_NOTARY_APPLE_ID:-}" && -n "${MACOS_NOTARY_PASSWORD:-}" && -n "${MACOS_TEAM_ID:-}" ]]; then
            xcrun notarytool submit "$DMG" --apple-id "$MACOS_NOTARY_APPLE_ID" --password "$MACOS_NOTARY_PASSWORD" --team-id "$MACOS_TEAM_ID" --wait
            xcrun stapler staple "$DMG"
          else
            echo "Developer ID/notarization credentials not configured; beta remains ad-hoc/unnotarized."
          fi
          cd dist
          shasum -a 256 "CrashVector-${VERSION}-macOS-universal.dmg" > "CrashVector-${VERSION}-macOS-universal.dmg.sha256"
          shasum -a 256 -c "CrashVector-${VERSION}-macOS-universal.dmg.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: crashvector-macos
          path: |
            dist/CrashVector-${{ env.VERSION }}-macOS-universal.dmg
            dist/CrashVector-${{ env.VERSION }}-macOS-universal.dmg.sha256
          if-no-files-found: error
          retention-days: 7

  windows-export:
    name: Windows export
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Download official Godot 4.4.1 export templates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, urllib.request, zipfile
          tag = os.environ['GODOT_TAG']
          url = f'https://github.com/godotengine/godot/releases/download/{tag}/Godot_v{tag}_export_templates.tpz'
          target = '/tmp/templates.tpz'
          urllib.request.urlretrieve(url, target)
          with zipfile.ZipFile(target) as archive:
              archive.extractall('/tmp/templates')
          PY
          TEMPLATE_HOME="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TEMPLATE_HOME"
          cp -R /tmp/templates/templates/. "$TEMPLATE_HOME/"
          test -f "$TEMPLATE_HOME/windows_release_x86_64.exe"
      - name: Prepare and export real Windows application
        shell: bash
        run: |
          set -euo pipefail
          if ! python3 -m pip --version >/dev/null 2>&1; then
            apt-get update
            apt-get install -y python3-pip
          fi
          python3 -m pip install --disable-pip-version-check --break-system-packages Pillow==11.3.0 || python3 -m pip install --disable-pip-version-check Pillow==11.3.0
          godot --headless --path . --editor --quit
          godot --headless --path . --script res://tools/render_icon.gd
          python3 tools/generate_icon_containers.py
          python3 tools/prepare_packaging.py
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows x64" "build/windows/CrashVector.exe"
          test -s build/windows/CrashVector.exe
          test -s build/windows/CrashVector.pck
          test -s build/icons/CrashVector.ico
      - uses: actions/upload-artifact@v4
        with:
          name: windows-export-input
          path: |
            build/windows/CrashVector.exe
            build/windows/CrashVector.pck
            build/icons/CrashVector.ico
          if-no-files-found: error
          retention-days: 1

  windows-package:
    name: Windows x64 package
    needs: windows-export
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y
      - uses: actions/download-artifact@v4
        with:
          name: windows-export-input
          path: build
      - name: Apply and verify executable branding
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          python tools/prepare_packaging.py
          $version = python tools/prepare_packaging.py --print-version
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if (-not (Test-Path "build\windows\CrashVector.exe")) { throw "CrashVector.exe missing" }
          if (-not (Test-Path "build\windows\CrashVector.pck")) { throw "CrashVector.pck missing" }
          if (-not (Test-Path "build\icons\CrashVector.ico")) { throw "CrashVector.ico missing" }
          New-Item -ItemType Directory -Force -Path build\tools | Out-Null
          & curl.exe --fail --location --retry 3 --retry-all-errors --output "build\tools\rcedit-x64.exe" "https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe"
          if ($LASTEXITCODE -ne 0) { throw "rcedit download failed" }
          $meta = Get-Content "build/version-metadata.json" | ConvertFrom-Json
          & "build\tools\rcedit-x64.exe" "build\windows\CrashVector.exe" `
            --set-icon "build\icons\CrashVector.ico" `
            --set-file-version $meta.windows_numeric_version `
            --set-product-version $meta.windows_numeric_version `
            --set-version-string CompanyName "ArrowSK" `
            --set-version-string ProductName "CrashVector" `
            --set-version-string FileDescription "CrashVector educational 3D crash simulation" `
            --set-version-string Comments "CrashVector $version"
          if ($LASTEXITCODE -ne 0) { throw "rcedit failed" }
          $info = (Get-Item "build\windows\CrashVector.exe").VersionInfo
          if ($info.ProductName -ne "CrashVector" -or $info.CompanyName -ne "ArrowSK" -or $info.FileDescription -ne "CrashVector educational 3D crash simulation") { throw "Windows version resources mismatch" }
          Add-Type -AssemblyName System.Drawing
          $embeddedIcon = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path "build\windows\CrashVector.exe"))
          if ($null -eq $embeddedIcon) { throw "Embedded executable icon could not be read" }
          $embeddedIcon.Dispose()
      - name: Sign executable when configured
        shell: powershell
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_PFX)) {
            Write-Host "Authenticode credentials not configured; beta executable remains unsigned."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "crashvector.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe not found" }
          & $signtool sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "build\windows\CrashVector.exe"
          if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed" }
          "WINDOWS_SIGNTOOL=$signtool" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_PFX=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build, validate and checksum installer
        shell: powershell
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found" }
          & $iscc "packaging\windows\crashvector.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup build failed" }
          $setup = "dist\CrashVector-$env:VERSION-Windows-x64-Setup.exe"
          if (-not (Test-Path $setup)) { throw "Windows Setup EXE missing" }
          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNTOOL)) {
            & $env:WINDOWS_SIGNTOOL sign /f $env:WINDOWS_PFX /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $setup
            if ($LASTEXITCODE -ne 0) { throw "Installer Authenticode signing failed" }
          } else {
            Write-Host "Authenticode credentials not configured; beta installer remains unsigned."
          }
          $resolvedSetup = Resolve-Path $setup
          $installDir = Join-Path $env:RUNNER_TEMP "CrashVectorInstallTest"
          & $resolvedSetup /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR="$installDir"
          if ($LASTEXITCODE -ne 0) { throw "Installer validation run failed" }
          if (-not (Test-Path (Join-Path $installDir "CrashVector.exe"))) { throw "Installed executable missing" }
          $uninstaller = Join-Path $installDir "unins000.exe"
          if (-not (Test-Path $uninstaller)) { throw "Standard uninstaller missing" }
          & $uninstaller /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          if ($LASTEXITCODE -ne 0) { throw "Uninstaller validation run failed" }
          Start-Sleep -Seconds 2
          if (Test-Path (Join-Path $installDir "CrashVector.exe")) { throw "Uninstall left CrashVector executable behind" }
          $hash = (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLowerInvariant()
          $name = [IO.Path]::GetFileName($setup)
          "$hash  $name" | Set-Content -Encoding ascii "$setup.sha256"
          if ((Get-FileHash -Algorithm SHA256 $setup).Hash.ToLowerInvariant() -ne $hash) { throw "SHA-256 verification failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: crashvector-windows
          path: |
            dist/CrashVector-${{ env.VERSION }}-Windows-x64-Setup.exe
            dist/CrashVector-${{ env.VERSION }}-Windows-x64-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish immutable GitHub release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [core-ci, macos-package, windows-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve version and guard immutable release
        id: release_guard
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 tools/prepare_packaging.py --print-version)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Download validated packages
        if: steps.release_guard.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: crashvector-*
          path: release-assets
          merge-multiple: true
      - name: Verify packages and build update manifest
        if: steps.release_guard.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.release_guard.outputs.version }}"
          cd release-assets
          sha256sum -c "CrashVector-${VERSION}-macOS-universal.dmg.sha256"
          sha256sum -c "CrashVector-${VERSION}-Windows-x64-Setup.exe.sha256"
          cd ..
          python3 tools/build_update_manifest.py --version "$VERSION" --tag "v$VERSION" --macos "release-assets/CrashVector-${VERSION}-macOS-universal.dmg" --windows "release-assets/CrashVector-${VERSION}-Windows-x64-Setup.exe" --output "release-assets/update-manifest.json"
      - name: Publish release
        if: steps.release_guard.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.release_guard.outputs.version }}"
          NOTES="docs/releases/${VERSION}.md"
          test -f "$NOTES"
          args=(release create "v${VERSION}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "CrashVector ${VERSION}" --notes-file "$NOTES")
          [[ "$VERSION" == *-* ]] && args+=(--prerelease)
          args+=("release-assets/CrashVector-${VERSION}-macOS-universal.dmg" "release-assets/CrashVector-${VERSION}-macOS-universal.dmg.sha256" "release-assets/CrashVector-${VERSION}-Windows-x64-Setup.exe" "release-assets/CrashVector-${VERSION}-Windows-x64-Setup.exe.sha256" "release-assets/update-manifest.json")
          gh "${args[@]}"
          gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY"
