name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  physics-tests:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import and parse project
        run: godot --headless --path . --editor --quit

      - name: Run M0 smoke tests
        run: godot --headless --path . --script res://tests/m0_smoke.gd

      - name: Run M1 structural tests
        run: godot --headless --path . --script res://tests/m1_structural.gd

      - name: Run M2 compact-hatchback tests
        run: godot --headless --path . --script res://tests/m2_hatchback.gd

      - name: Run M3 vehicle and truck tests
        run: godot --headless --path . --script res://tests/m3_vehicle_truck.gd
