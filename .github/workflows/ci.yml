name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  m0-smoke:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import and parse project
        run: godot --headless --path . --editor --quit

      - name: Run M0 smoke tests
        run: godot --headless --path . --script res://tests/m0_smoke.gd
