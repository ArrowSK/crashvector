name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crashvector-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.4.1

jobs:
  regression:
    name: Consolidated M0-M21 regression
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Architecture audit
        run: sh tools/check_no_monkey_patching.sh
      - name: Import and parse project once
        run: |
          tools/ci_godot_checked.sh godot --headless --path . --editor --quit
          tools/ci_godot_checked.sh godot --headless --path . --script res://tests/project_parse.gd
      - name: Run unique production regressions
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            m0_smoke.gd
            m1_structural.gd
            m2_hatchback.gd
            m3_vehicle_truck.gd
            m4_scenario_editor.gd
            m5_analysis_replay.gd
            m5_editor_smoke.gd
            m6_comparison.gd
            m6_editor_smoke.gd
            m7_video_export.gd
            m7_editor_smoke.gd
            m8_calibration.gd
            m8_editor_smoke.gd
            road_users_comparison.gd
            road_users_editor_smoke.gd
            m9_updater.gd
            m9_editor_smoke.gd
            m10_editor_smoke.gd
            m10_layout.gd
            m11_crush_dynamics.gd
            m12_hybrid_physics.gd
            m12_production_path.gd
            m13_whole_body_failure.gd
            m14_road_users_obstacles.gd
            m14_production_path.gd
            m15_articulated_road_users.gd
            m16_ui_vehicle_visuals.gd
            m16_1_visual_polish.gd
            m16_1_d_segment_200_barrier.gd
            m16_2_presentation_corrections.gd
            m16_2_packaged_cases.gd
            m16_2_light_target_crush.gd
            kenney_car_kit_visuals.gd
            m17_production_integration.gd
            runtime_presentation_stability.gd
            m18_side_impacts.gd
            m19_contact_fidelity.gd
            m20_heavy_other_impacts.gd
            m21_articulated_truck.gd
          )
          for test_script in "${tests[@]}"; do
            echo "=== ${test_script} ==="
            tools/ci_godot_checked.sh godot --headless --path . --script "res://tests/${test_script}"
          done
